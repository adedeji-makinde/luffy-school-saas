version: '3.8'
services:
  app:
    build: 
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace:cached
      - claude-config:/home/vscode/.claude
    command: sleep infinity
    environment:
      # Development only, and deliberately explicit. settings.py defaults to
      # SMTP so that a deploy which never sets this fails loudly instead of
      # printing live invitation tokens to the application log.
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      # Where the invitation accept page lives. settings.py has no default for
      # this on purpose — every candidate default is wrong somewhere, and the
      # one it replaced (build it from the issuing admin's request host) is the
      # bug the setting exists to remove. There is no frontend in this repo yet,
      # so the development value is a placeholder origin that is obviously not a
      # real one; it makes the link deterministic and inspectable in the console
      # backend's output without pretending to resolve.
      INVITATION_ACCEPT_URL: http://localhost:3000/invitations/{token}/
      # Also development only, and explicit for the same reason. settings.py
      # defaults DEBUG to off and refuses to start without a real
      # DJANGO_SECRET_KEY, so a deploy that sets neither fails loudly instead
      # of serving tracebacks signed with a key that is public in this repo.
      DJANGO_DEBUG: "1"
    depends_on:
      - db
    
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: luffy_db
      POSTGRES_USER: luffy_admin
      POSTGRES_PASSWORD: changeme

volumes:
  postgres-data:
  claude-config:
